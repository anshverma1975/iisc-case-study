<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - EduTracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="row justify-content-center mt-4">
                <div class="col-md-4">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="card p-2">
                <div class="card-body">
                    <h3 class="card-title text-center mb-1 login-title">Login</h3>
                    <p class="text-center text-muted mb-4 mt-2">Good to see you back, explorer</p>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <p>Don't have an account?</p>
                        <a href="{{ url_for('register_researcher') }}" class="btn btn-outline-primary btn-sm">Register as Researcher</a>
                        <a href="{{ url_for('register_staff') }}" class="btn btn-outline-primary btn-sm">Register as Staff</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
